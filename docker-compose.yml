version: "3.9"

services:

  app:
    build: .
    container_name: ai-llm-app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    volumes:
      - .:/app

  postgres:
    image: postgres:15

    container_name: ai-llm-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_llm_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: ai-llm-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: