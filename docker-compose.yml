services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-llm-app

    restart: always

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    deploy:
      resources:
        limits:
          memory: 4g

  postgres:
    image: pgvector/pgvector:pg15

    container_name: ai-llm-postgres

    restart: always

    shm_size: 1gb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_llm_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: ai-llm-redis

    restart: always

    ports:
      - "6379:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest

    container_name: ai-llm-nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
  redis_data: