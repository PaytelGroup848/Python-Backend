services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-llm-app

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - platform_data:/data

    deploy:
      resources:
        limits:
          memory: 4g


  chat-request-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-request-worker

    restart: always

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    env_file:
      - .env

    command: >
      python -m workers.chat_request_worker

    volumes:
      - .:/app
      - platform_data:/data


  chat-response-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-response-worker

    restart: always

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - .env

    command: >
      python -m workers.chat_response_worker

    volumes:
      - .:/app
      - platform_data:/data

  training-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: training-worker

    restart: always

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    env_file:
      - .env

    command: >
      python -m workers.training_worker

    volumes:
      - .:/app
      - platform_data:/data


  postgres:
    image: pgvector/pgvector:pg15

    container_name: ai-llm-postgres

    restart: always

    shm_size: 1gb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_llm_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1;'"]
      interval: 5s
      timeout: 3s
      retries: 5

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine

    container_name: ai-llm-redis

    restart: always

    ports:
      - "6379:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres_data:
  redis_data:
  platform_data:

