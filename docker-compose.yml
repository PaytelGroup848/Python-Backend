services:

  app:
    build: .
    container_name: ai-llm-app

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    volumes:
      - .:/app

  postgres:
    image: pgvector/pgvector:0.8.0-pg15

    container_name: ai-llm-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_llm_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: ai-llm-redis

    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest

    container_name: ai-llm-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

volumes:
  postgres_data: